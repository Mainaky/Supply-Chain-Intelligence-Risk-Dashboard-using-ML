services:
  - type: pserv
    name: supply-chain-api
    runtime: python
    plan: starter
    region: singapore
    branch: main
    buildCommand: pip install -r requirements-common.txt -r requirements-api.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: PORT
        value: 10000
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: supply-chain-users
          property: connectionString

  - type: web
    name: supply-chain-dashboard
    runtime: python
    plan: starter
    region: singapore
    branch: main
    buildCommand: pip install -r requirements-common.txt -r requirements-dashboard.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    healthCheckPath: /_stcore/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: API_HOST
        fromService:
          name: supply-chain-api
          type: pserv
          property: host
      - key: API_PORT
        fromService:
          name: supply-chain-api
          type: pserv
          property: port

databases:
  - name: supply-chain-users
    plan: 0.1c-256mb
    region: singapore
    databaseName: supply_chain_users
    user: supply_chain_app
